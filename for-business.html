<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/jpeg" href="images/logo.jpg?v=mazad-global-icon-1">
    <link rel="apple-touch-icon" href="images/logo.jpg?v=mazad-global-icon-1">
    <meta name="theme-color" content="#242527">

    <title>For Business — MAZAD GLOBAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root{--business-orange:#FF841A}
        html,body{margin:0;min-height:100%;background:#020617;color:#fff;font-family:Inter,Arial,sans-serif}
        html{scroll-behavior:smooth}
        body{min-height:100vh;overflow-x:hidden}
        main{min-height:100vh;background:transparent}
        .business-page{position:relative;overflow:hidden;background:transparent}
        .business-page::before{content:"";position:fixed;z-index:0;inset:0;pointer-events:none;background:
            radial-gradient(circle at 50% 50%,#FF841A 0%,#020617 80%);
            opacity:.3;animation:business-breathe 15s ease-in-out infinite}
        .business-page::after{content:"";position:absolute;z-index:0;inset:0;pointer-events:none;opacity:.18;background-image:
            radial-gradient(rgba(255,132,26,.28) .8px,transparent .8px);background-size:34px 34px;
            -webkit-mask-image:linear-gradient(#000,transparent 88%);mask-image:linear-gradient(#000,transparent 88%)}
        .business-shell{position:relative;z-index:2;width:min(100% - 48px,1240px);margin-inline:auto}
        .business-hero{min-height:790px;padding:165px 0 95px;display:grid;grid-template-columns:minmax(0,1.04fr) minmax(400px,.96fr);gap:74px;align-items:center}
        .business-kicker{display:inline-flex;align-items:center;gap:10px;padding:8px 13px;border:1px solid rgba(255,132,26,.34);border-radius:999px;background:rgba(255,132,26,.09);color:#fb923c;font-size:11px;font-weight:850;letter-spacing:.17em;text-transform:uppercase;box-shadow:0 0 22px rgba(255,132,26,.08)}
        .business-kicker i{width:7px;height:7px;border-radius:50%;background:#FF841A;box-shadow:0 0 12px #FF841A;animation:business-pulse 1.8s ease-in-out infinite}
        .business-hero h1{max-width:760px;margin:25px 0 23px;font-size:clamp(44px,5.4vw,78px);font-weight:950;line-height:.98;letter-spacing:-.045em}
        .business-hero-copy{max-width:680px;margin:0;color:rgba(255,255,255,.68);font-size:clamp(16px,1.7vw,20px);line-height:1.75}
        .business-jump{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
        .business-jump a{display:inline-flex;align-items:center;gap:8px;padding:11px 15px;border:1px solid rgba(255,132,26,.27);border-radius:999px;background:linear-gradient(135deg,rgba(255,132,26,.1),rgba(255,255,255,.03));color:rgba(255,255,255,.8);font-size:10px;font-weight:850;letter-spacing:.1em;text-decoration:none;text-transform:uppercase;box-shadow:0 0 20px rgba(255,132,26,.07);transition:.35s ease}
        .business-jump a::before{content:"";width:6px;height:6px;border-radius:50%;background:#FF841A;box-shadow:0 0 9px #FF841A}
        .business-jump a:hover{color:#fff;border-color:rgba(255,132,26,.68);background:rgba(255,132,26,.15);transform:translateY(-4px);box-shadow:0 0 28px rgba(255,132,26,.2)}
        .growth-stage{position:relative;min-height:550px;display:grid;place-items:center;perspective:1200px}
        .growth-aura{position:absolute;width:85%;height:72%;border-radius:50%;background:radial-gradient(circle,rgba(255,132,26,.37),rgba(255,132,26,.08) 48%,transparent 72%);filter:blur(48px);animation:business-aura 4.3s ease-in-out infinite}
        .growth-stack{position:relative;width:min(100%,500px);height:500px;transform:rotateY(-7deg);transform-style:preserve-3d}
        .growth-axis{position:absolute;left:10%;right:8%;bottom:42px;height:1px;background:linear-gradient(90deg,rgba(255,132,26,.05),rgba(255,132,26,.72));transform:rotate(-31deg);transform-origin:left center;box-shadow:0 0 16px rgba(255,132,26,.45)}
        .growth-axis::after{content:"";position:absolute;right:-2px;top:-5px;width:11px;height:11px;border-top:2px solid #FF841A;border-right:2px solid #FF841A;transform:rotate(45deg)}
        .growth-card{position:absolute;left:var(--x);bottom:var(--y);width:230px;min-height:104px;padding:17px;border:1px solid rgba(255,132,26,.3);border-radius:20px;background:linear-gradient(145deg,rgba(19,24,48,.94),rgba(4,8,23,.95));box-shadow:0 22px 60px rgba(0,0,0,.36),0 0 28px rgba(255,132,26,.08),inset 0 1px rgba(255,255,255,.06);transform:translateZ(var(--z)) rotateZ(-2deg);animation:growth-float 4s ease-in-out infinite;animation-delay:var(--delay);transition:.4s ease}
        .growth-card:hover{z-index:8;border-color:rgba(255,132,26,.72);transform:translateZ(90px) translateY(-9px) rotateZ(0);box-shadow:0 30px 75px rgba(0,0,0,.48),0 0 55px rgba(255,132,26,.24)}
        .growth-card-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
        .growth-icon{display:grid;place-items:center;width:39px;height:39px;border:1px solid rgba(255,132,26,.42);border-radius:12px;background:rgba(255,132,26,.11);color:#fb923c;box-shadow:0 0 20px rgba(255,132,26,.13)}
        .growth-icon svg{width:21px;height:21px}.growth-number{color:#FF841A;font:850 9px/1 ui-monospace,monospace;letter-spacing:.15em}
        .growth-card strong{display:block;margin-top:13px;color:#fff;font-size:14px;letter-spacing:.015em}.growth-card small{display:block;margin-top:5px;color:rgba(255,255,255,.43);font-size:9px;line-height:1.4}
        .business-section{padding:45px 0 125px;scroll-margin-top:120px}
        .business-section-head{max-width:800px;margin:0 auto 54px;text-align:center}
        .business-section-head h2{margin:17px 0 17px;font-size:clamp(34px,4.2vw,56px);line-height:1.05;letter-spacing:-.038em}
        .business-section-head p{margin:0;color:rgba(255,255,255,.62);font-size:16px;line-height:1.75}
        .business-reveal{opacity:0;transform:translateY(48px) scale(.987);transition:opacity .8s ease,transform .8s cubic-bezier(.16,1,.3,1)}
        .business-reveal.is-visible{opacity:1;transform:none}
        .seller-panel{position:relative;padding:48px;border:1px solid rgba(255,132,26,.28);border-radius:38px;background:radial-gradient(circle at 12% 4%,rgba(255,132,26,.14),transparent 32%),rgba(255,255,255,.026);box-shadow:0 34px 90px rgba(0,0,0,.28);overflow:hidden}
        .seller-panel::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.045) 50%,transparent 62%);transform:translateX(-110%);animation:business-sweep 6.2s ease-in-out infinite}
        .seller-summary{position:relative;display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:58px;align-items:start}
        .seller-summary h3{margin:17px 0 14px;font-size:clamp(30px,3.4vw,46px);line-height:1.04;letter-spacing:-.035em}
        .seller-summary p{margin:0;color:rgba(255,255,255,.67);line-height:1.75}
        .seller-cta{display:inline-flex;margin-top:25px;padding:12px 18px;border:1px solid rgba(255,132,26,.5);border-radius:999px;background:rgba(255,132,26,.12);color:#fb923c;font-size:11px;font-weight:850;letter-spacing:.1em;text-decoration:none;text-transform:uppercase;transition:.3s ease}
        .seller-cta:hover{background:#FF841A;color:#fff;box-shadow:0 0 30px rgba(255,132,26,.35);transform:translateY(-3px)}
        .business-feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
        .business-feature{display:flex;align-items:flex-start;gap:10px;min-height:68px;padding:14px;border:1px solid rgba(255,132,26,.13);border-radius:16px;background:linear-gradient(135deg,rgba(255,132,26,.07),rgba(2,6,23,.55));color:rgba(255,255,255,.78);font-size:11px;font-weight:650;line-height:1.5;transition:.3s ease}
        .business-feature i{flex:0 0 7px;width:7px;height:7px;margin-top:5px;border-radius:50%;background:#FF841A;box-shadow:0 0 10px #FF841A}
        .business-feature:hover{color:#fff;border-color:rgba(255,132,26,.5);background:rgba(255,132,26,.12);transform:translateY(-4px);box-shadow:0 16px 34px rgba(0,0,0,.2),0 0 22px rgba(255,132,26,.09)}
        .onboarding{margin-top:64px;padding-top:44px;border-top:1px solid rgba(255,255,255,.08)}
        .onboarding-head{max-width:700px}.onboarding-head h3{margin:13px 0 12px;font-size:clamp(26px,3vw,39px);letter-spacing:-.03em}.onboarding-head p{color:rgba(255,255,255,.58)}
        .onboarding-track{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:13px;margin-top:40px}
        .onboarding-line{position:absolute;z-index:0;top:24px;left:7%;right:7%;height:1px;background:rgba(255,255,255,.1)}
        .onboarding-line::after{content:"";display:block;width:var(--onboarding-progress,0%);height:100%;background:#FF841A;box-shadow:0 0 16px #FF841A;transition:width .14s linear}
        .onboarding-step{position:relative;z-index:1;text-align:center;opacity:0;transform:translateY(20px);transition:.55s ease}
        .onboarding-step.is-visible{opacity:1;transform:none}
        .onboarding-number{display:grid;place-items:center;width:49px;height:49px;margin:0 auto 17px;border:1px solid rgba(255,132,26,.42);border-radius:50%;background:#071022;color:#fb923c;font:850 11px/1 ui-monospace,monospace;box-shadow:0 0 20px rgba(255,132,26,.13)}
        .onboarding-step.is-visible .onboarding-number{background:#FF841A;color:#fff;box-shadow:0 0 28px rgba(255,132,26,.5)}
        .onboarding-step p{margin:0;color:rgba(255,255,255,.63);font-size:11px;line-height:1.5}
        .audience-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
        .audience-card{position:relative;padding:38px;border:1px solid rgba(255,255,255,.09);border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.018));box-shadow:0 28px 70px rgba(0,0,0,.24);overflow:hidden;transition:.4s ease}
        .audience-card::before{content:"";position:absolute;width:200px;height:200px;border-radius:50%;top:-80px;right:-55px;background:rgba(255,132,26,.16);filter:blur(55px)}
        .audience-card:hover{border-color:rgba(255,132,26,.5);transform:translateY(-7px);box-shadow:0 34px 85px rgba(0,0,0,.32),0 0 38px rgba(255,132,26,.09)}
        .audience-icon{display:grid;place-items:center;width:55px;height:55px;border:1px solid rgba(255,132,26,.42);border-radius:17px;background:rgba(255,132,26,.11);color:#fb923c;box-shadow:0 0 26px rgba(255,132,26,.15)}.audience-icon svg{width:28px;height:28px}
        .audience-card h3{position:relative;margin:22px 0 8px;font-size:29px}.audience-card>p{position:relative;margin:0 0 24px;color:#fb923c;font-size:13px;font-weight:750}
        .audience-list{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px}.audience-list span{display:flex;gap:9px;padding:11px;border:1px solid rgba(255,255,255,.07);border-radius:13px;background:rgba(2,6,23,.42);color:rgba(255,255,255,.68);font-size:11px;line-height:1.45}.audience-list span::before{content:"";flex:0 0 6px;width:6px;height:6px;margin-top:5px;border-radius:50%;background:#FF841A;box-shadow:0 0 8px #FF841A}
        #business-integrations,#business-partners{position:relative}
        #business-integrations::before,#business-partners::before{content:"";position:absolute;z-index:-1;left:50%;top:45%;width:min(92vw,1080px);height:520px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,132,26,.2),rgba(255,132,26,.055) 42%,transparent 72%);filter:blur(34px);pointer-events:none}
        #business-integrations .business-section-head,#business-partners .business-section-head{position:relative;max-width:900px;padding:34px 38px;margin-bottom:38px;border:1px solid rgba(255,132,26,.34);border-radius:28px;background:linear-gradient(145deg,rgba(255,132,26,.13),rgba(4,8,23,.76));box-shadow:0 25px 70px rgba(0,0,0,.34),0 0 42px rgba(255,132,26,.14),inset 0 1px rgba(255,255,255,.08);overflow:hidden}
        #business-integrations .business-section-head::after,#business-partners .business-section-head::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 36%,rgba(255,255,255,.09) 50%,transparent 64%);transform:translateX(-115%);animation:business-sweep 5.8s ease-in-out infinite;pointer-events:none}
        #business-integrations .business-section-head h2,#business-partners .business-section-head h2{position:relative;color:#fff;text-shadow:0 0 28px rgba(255,132,26,.32)}
        #business-integrations .business-section-head p,#business-partners .business-section-head p{position:relative;color:rgba(255,255,255,.83)}
        .integration-panel{position:relative;padding:52px;border:1px solid rgba(255,132,26,.48);border-radius:36px;background:radial-gradient(circle at 50% 50%,rgba(255,132,26,.2),transparent 43%),linear-gradient(145deg,rgba(13,19,43,.96),rgba(3,7,21,.94));box-shadow:0 34px 90px rgba(0,0,0,.38),0 0 50px rgba(255,132,26,.16),inset 0 1px rgba(255,255,255,.07);overflow:hidden}
        .integration-panel::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(255,132,26,.13),transparent 24%);animation:integration-orbit 9s linear infinite;pointer-events:none}
        .integration-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
        .integration-card{position:relative;min-height:154px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;padding:20px 16px;text-align:center;border:1px solid rgba(255,132,26,.32);border-radius:20px;background:linear-gradient(145deg,rgba(255,132,26,.13),rgba(4,8,23,.9) 58%);color:rgba(255,255,255,.94);font-size:12px;font-weight:800;line-height:1.4;box-shadow:0 15px 38px rgba(0,0,0,.28),0 0 24px rgba(255,132,26,.1),inset 0 1px rgba(255,255,255,.07);transition:.35s ease;animation:integration-breathe 4s ease-in-out infinite;animation-delay:var(--delay);overflow:hidden}
        .integration-card::after{content:"";position:absolute;inset:auto 15% 0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,132,26,.7),transparent);box-shadow:0 0 11px rgba(255,132,26,.4)}
        .integration-icon{display:grid;place-items:center;width:48px;height:48px;border:1px solid rgba(255,132,26,.5);border-radius:15px;background:linear-gradient(145deg,rgba(255,132,26,.2),rgba(255,132,26,.06));color:#fb923c;box-shadow:0 0 24px rgba(255,132,26,.17),inset 0 1px rgba(255,255,255,.09);transition:.35s ease}
        .integration-icon svg{width:25px;height:25px}.integration-card strong{font-size:12px}.integration-card small{display:flex;align-items:center;gap:7px;color:rgba(255,255,255,.42);font:750 8px/1 ui-monospace,monospace;letter-spacing:.13em}.integration-card small i{width:5px;height:5px;border-radius:50%;background:#FF841A;box-shadow:0 0 8px #FF841A}
        .integration-card:hover{color:#fff;border-color:rgba(255,132,26,.56);background:rgba(255,132,26,.12);transform:translateY(-6px) scale(1.02);box-shadow:0 22px 46px rgba(0,0,0,.28),0 0 30px rgba(255,132,26,.12)}
        .integration-card:hover .integration-icon{transform:translateY(-3px) scale(1.08);background:rgba(255,132,26,.24);box-shadow:0 0 34px rgba(255,132,26,.3)}
        .partner-layout{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:24px;align-items:stretch}
        .partner-categories,.partner-brief{position:relative;padding:40px;border:1px solid rgba(255,132,26,.38);border-radius:31px;background:radial-gradient(circle at 12% 8%,rgba(255,132,26,.16),transparent 38%),linear-gradient(145deg,rgba(13,19,43,.94),rgba(3,7,21,.93));box-shadow:0 28px 75px rgba(0,0,0,.32),0 0 40px rgba(255,132,26,.12),inset 0 1px rgba(255,255,255,.07);overflow:hidden}
        .partner-categories::after,.partner-brief::after{content:"";position:absolute;width:180px;height:180px;right:-80px;bottom:-90px;border:1px solid rgba(255,132,26,.24);border-radius:50%;box-shadow:0 0 42px rgba(255,132,26,.1);pointer-events:none}
        .partner-categories h3,.partner-brief h3{position:relative;margin:0 0 12px;color:#fff;font-size:28px;text-shadow:0 0 24px rgba(255,132,26,.2)}.partner-categories>p,.partner-brief>p{position:relative;margin:0 0 27px;color:rgba(255,255,255,.8);line-height:1.7}
        .partner-category-grid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px}.partner-category{display:flex;align-items:center;gap:10px;padding:13px;border:1px solid rgba(255,132,26,.3);border-radius:14px;background:linear-gradient(135deg,rgba(255,132,26,.13),rgba(2,6,23,.55));color:rgba(255,255,255,.92);font-size:11px;font-weight:760;box-shadow:0 10px 28px rgba(0,0,0,.16);transition:.3s ease}.partner-category:hover{border-color:rgba(255,132,26,.72);background:rgba(255,132,26,.18);transform:translateY(-3px);box-shadow:0 15px 32px rgba(0,0,0,.24),0 0 24px rgba(255,132,26,.13)}.partner-category i{width:7px;height:7px;border-radius:50%;background:#FF841A;box-shadow:0 0 12px #FF841A}
        .partnership-fields{display:grid;grid-template-columns:1fr 1fr;gap:11px}.partnership-field{display:flex;flex-direction:column;gap:8px;min-height:57px;padding:11px 14px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:#060b1d;color:rgba(255,255,255,.47);font-size:10px;transition:.3s ease}.partnership-field:focus-within{border-color:rgba(255,132,26,.55);box-shadow:0 0 22px rgba(255,132,26,.1)}.partnership-field input,.partnership-field textarea{width:100%;min-width:0;padding:0;border:0;outline:0;resize:vertical;background:transparent;color:#fff;font:600 12px/1.45 Inter,Arial,sans-serif}.partnership-field:last-child{grid-column:1/-1;min-height:86px}
        .partner-action{display:inline-flex;margin-top:18px;padding:12px 18px;border-radius:999px;background:#FF841A;color:#fff;font-size:11px;font-weight:850;letter-spacing:.1em;text-decoration:none;text-transform:uppercase;box-shadow:0 0 28px rgba(255,132,26,.3);transition:.3s ease}.partner-action:hover{background:#fb923c;transform:translateY(-3px);box-shadow:0 0 40px rgba(255,132,26,.46)}
        @keyframes business-breathe{0%,100%{transform:scale(1);opacity:.23}50%{transform:scale(1.18);opacity:.4}}
        @keyframes business-pulse{50%{opacity:.45;transform:scale(.75)}}@keyframes business-aura{50%{transform:scale(1.14);opacity:.8}}
        @keyframes growth-float{50%{transform:translateZ(var(--z)) translateY(-8px) rotateZ(1deg)}}@keyframes business-sweep{0%,60%{transform:translateX(-110%)}90%,100%{transform:translateX(110%)}}
        @keyframes integration-breathe{50%{border-color:rgba(255,132,26,.62);box-shadow:0 18px 44px rgba(0,0,0,.3),0 0 31px rgba(255,132,26,.2)}}
        @keyframes integration-orbit{to{transform:rotate(360deg)}}
        @media(max-width:980px){
            .business-hero{grid-template-columns:1fr;gap:30px;padding-top:150px;text-align:center}.business-hero-copy{margin-inline:auto}.business-jump{justify-content:center}.growth-stage{min-height:520px}
            .seller-summary{grid-template-columns:1fr}.business-feature-grid{grid-template-columns:repeat(2,1fr)}.onboarding-track{grid-template-columns:repeat(3,1fr);gap:27px 15px}.onboarding-line{display:none}
            .integration-grid{grid-template-columns:repeat(2,1fr)}.partner-layout{grid-template-columns:1fr}
        }
        @media(max-width:620px){
            .business-shell{width:min(100% - 30px,1240px)}.business-hero{min-height:auto;padding:130px 0 70px}.business-hero h1{font-size:41px;line-height:1.04}.growth-stage{min-height:470px}
            .growth-stack{width:340px;max-width:100%;height:440px;transform:none}.growth-card{width:190px;left:var(--mx);bottom:var(--my);padding:14px}.growth-axis{display:none}
            .business-section{padding-bottom:88px}.seller-panel{padding:26px 20px;border-radius:27px}.business-feature-grid{grid-template-columns:1fr}.onboarding-track{grid-template-columns:1fr 1fr}
            .audience-grid{grid-template-columns:1fr}.audience-card{padding:28px 22px}.audience-list{grid-template-columns:1fr}.integration-panel{padding:28px 20px}.integration-grid{grid-template-columns:1fr 1fr}.integration-card{min-height:140px;padding:16px 10px;font-size:10px}.integration-icon{width:43px;height:43px}.integration-icon svg{width:22px;height:22px}
            .partner-categories,.partner-brief{padding:28px 22px}.partner-category-grid,.partnership-fields{grid-template-columns:1fr}.partnership-field:last-child{grid-column:auto}
        }
        /* Readability pass: supporting copy remains secondary, but no longer tiny. */
        .growth-card small{font-size:12px;line-height:1.55;color:rgba(255,255,255,.68)}
        .seller-summary p,.onboarding-head p,.partner-categories>p,.partner-brief>p{font-size:16px;color:rgba(255,255,255,.78)}
        .business-feature,.onboarding-step p,.audience-list span,.partner-category{font-size:13px;line-height:1.6;color:rgba(255,255,255,.82)}
        .integration-card,.integration-card strong{font-size:14px}
        .integration-card small{font-size:11px;line-height:1.4;color:rgba(255,255,255,.66)}
        .partnership-field{font-size:12px;color:rgba(255,255,255,.68)}
        html[dir="rtl"] .growth-stack{transform:rotateY(7deg)}
        @media(prefers-reduced-motion:reduce){
            html{scroll-behavior:auto}.business-page::before,.business-kicker i,.growth-aura,.growth-card,.seller-panel::before,.integration-card,.integration-panel::before,#business-integrations .business-section-head::after,#business-partners .business-section-head::after{animation:none!important}.business-reveal,.onboarding-step{opacity:1;transform:none;transition:none}
        }
    </style>
